<img id="themeIllust" class="themeIllust"
     src="https://cos.ezradio.net/theme/bbb/tbh1.avif" alt="" style="float: inline-start;">

<script>
(function () {
  var base = "https://cos.ezradio.net/theme/bbb/";

  var tail = new Date().getDate() % 10;        // 取日期个位：1→1, 10→0, 21→1, 31→1 ...
  var name = "tbh" + tail + ".avif";           // 尾号几就是 tbh几.avif

  var img = document.getElementById("themeIllust");
  if (img && img.src.indexOf(name) === -1) {
    img.src = base + name;
  }
})();
</script>
