<div class="share sticky-top sticky-top-offset">
    <p>
        Share
    </p>
    <ul>
        <li class="ml-1 mr-1">
            <a target="_blank" href="https://connect.qq.com/widget/shareqq/index.html?url={{ page.url | absolute_url }}&title={{ page.title }}" onclick="window.open(this.href, 'weixin-share', 'width=550,height=235');return false;">
                <i class="fa-brands fa-weixin"></i>
            </a>
        </li>

        <li class="ml-1 mr-1">
            <a target="_blank" href="service.weibo.com/share/share.php?title={{ page.title }}&url={{ page.url | absolute_url }}" onclick="window.open(this.href, 'weibo-share', 'width=550,height=435');return false;">
                <i class="fab fa-facebook-f"></i>
            </a>
        </li>

        <li class="ml-1 mr-1">
            <a target="_blank" href="https://www.linkedin.com/shareArticle?mini=true&url={{ page.url | absolute_url }}" onclick="window.open(this.href, 'width=550,height=435');return false;">
                <i class="fa-solid fa-link"></i>
            </a>
        </li>

    </ul>
    {% if page.comments != false %}
    <div class="sep">
    </div>
    <ul>
        <li>
        <a class="small smoothscroll" href="#disqus_thread"></a>
        </li>
    </ul>
    {% endif %}
</div>
